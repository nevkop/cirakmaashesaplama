<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dekont Süresi</title>

<style>

body{
    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;

    background: white;

    color:#111827;
}

.kart{

    width:320px;

    background: #ffffff;

    border:1px solid #e5e7eb;

    border-radius:18px;

    padding:20px;

    text-align:center;

    box-shadow:
    0 4px 18px rgba(0,0,0,0.08);
}

.baslik{
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

.alt{
    color:#6b7280;
    margin-bottom:18px;
    font-size:13px;
    line-height:1.4;
}

.sayac{

    font-size:20px;
    font-weight:bold;

    line-height:1.5;

    color:#2563eb;
}

.okul{

    margin-top:18px;

    font-size:11px;

    color:#9ca3af;

    letter-spacing:0.5px;
}

</style>
</head>

<body>

<div class="kart">

    <div class="baslik">
        📄 Dekont Süresi
    </div>

    <div class="alt">
        Her ayın 1'i ile 8'i 17:00'a kadar.
    </div>

    <div class="sayac" id="sayac">
        Yükleniyor...
    </div>

    <div class="okul">
        Şakirpaşa Mesleki ve Teknik Anadolu Lisesi
    </div>

</div>

<script>

function sayaciGuncelle(){

    const simdi = new Date();

    const yil = simdi.getFullYear();
    const ay = simdi.getMonth();

    const bitis = new Date(yil, ay, 8, 17, 0, 0);

    const alan = document.getElementById("sayac");

    if(simdi > bitis){

        alan.innerHTML =
        "✅ Süre sona erdi<br><br>📌 Yeni dönem ayın 1'inde başlayacak";

        alan.style.color = "#16a34a";

        return;
    }

    const fark = bitis - simdi;

    const gun = Math.floor(fark / (1000*60*60*24));

    const saat = Math.floor((fark / (1000*60*60)) % 24);

    const dakika = Math.floor((fark / (1000*60)) % 60);

    const saniye = Math.floor((fark / 1000) % 60);

    alan.style.color = "#2563eb";

    alan.innerHTML =
    gun + "G " +
    saat + "S " +
    dakika + "D " +
    saniye + "Sn";

}

sayaciGuncelle();

setInterval(sayaciGuncelle,1000);

</script>

</body>
</html>
